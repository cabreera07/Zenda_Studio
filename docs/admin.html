<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | zenda studio.</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin-wrap { max-width: 820px; margin: 48px auto; padding: 0 20px; }
    .glass-panel { background: rgba(255,255,255,0.72); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 12px 40px rgba(0,123,255,0.08); border-radius: 16px; padding: 28px; margin-bottom: 28px; }
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px; }
  </style>
</head>
<body>
  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
  <div class="admin-wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <a href="index.html" class="brand-logo"><span>zenda studio</span><span class="brand-dot"></span></a>
      <a href="index.html" class="btn btn-outline btn-sm">← Ver Tienda</a>
    </div>
    <div class="glass-panel">
      <h2 style="margin-bottom:16px;">Agregar Servicio / Paquete</h2>
      <form id="admin-form">
        <div class="form-row">
          <div class="form-group"><label>PIN de Administrador *</label><input type="password" id="pin" required placeholder="2026" /></div>
          <div class="form-group"><label>Categoría *</label><input type="text" id="categoria" required placeholder="Branding, Web, Video" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Nombre del Servicio *</label><input type="text" id="nombre" required placeholder="Paquete Pro" /></div>
          <div class="form-group"><label>Precio (sin símbolo) *</label><input type="text" id="precio" required placeholder="1,500" /></div>
        </div>
        <div class="form-group"><label>Descripción corta *</label><input type="text" id="descripcion" required /></div>
        <div class="form-group"><label>Entregables (separados por | )</label><input type="text" id="entregables" placeholder="Logo SVG|Manual de marca|3 revisiones" /></div>
        <div class="form-group"><label>Link de Imagen (Drive), GIF o Video (.mp4)</label><input type="text" id="imagen_drive" placeholder="https://drive.google.com/..." /></div>
        <div class="form-group" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="destacado" style="width:auto;" /><label for="destacado" style="margin:0;">Marcar como destacado (borde azul)</label>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-save">Guardar en Google Sheets</button>
        <p id="admin-status" class="form-status"></p>
      </form>
    </div>
    <div class="glass-panel">
      <h3 style="margin-bottom:12px;">Servicios Activos</h3>
      <div id="admin-list">Cargando...</div>
    </div>
  </div>
  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBQgX8U0CzNe_zH8slUUAgDPMlQG3o0TidWUQ8cX2I88tEGSa6-4zsZet6Y-bqqd12GQ/exec';
    async function cargarLista() {
      const list = document.getElementById('admin-list');
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const json = await res.json();
        list.innerHTML = (json.data || []).map(item => `
          <div class="admin-item">
            <div><strong>${item.nombre}</strong> <span style="color:var(--accent)">Q${item.precio}</span><div style="font-size:0.82rem; color:var(--text-muted)">${item.categoria}</div></div>
            <button class="btn btn-outline btn-sm" onclick="ocultarServicio('${item.id}')">Ocultar</button>
          </div>`).join('') || '<p>No hay servicios activos.</p>';
      } catch (e) { list.innerHTML = 'Error al conectar con Google Sheets.'; }
    }
    window.ocultarServicio = async function(id) {
      const pin = document.getElementById('pin').value || prompt('Ingresa tu PIN:');
      if (!pin) return;
      await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'toggle_service', id, pin }) });
      cargarLista();
    };
    document.getElementById('admin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save'); const status = document.getElementById('admin-status');
      btn.disabled = true; btn.textContent = 'Guardando...';
      const payload = {
        action: 'add_service', pin: document.getElementById('pin').value,
        categoria: document.getElementById('categoria').value.trim(), nombre: document.getElementById('nombre').value.trim(),
        precio: document.getElementById('precio').value.trim(), descripcion: document.getElementById('descripcion').value.trim(),
        entregables: document.getElementById('entregables').value.trim(), imagen_drive: document.getElementById('imagen_drive').value.trim(),
        destacado: document.getElementById('destacado').checked
      };
      const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
      const json = await res.json();
      status.textContent = json.status === 'ok' ? '✅ ¡Guardado en Google Sheets!' : '❌ ' + json.message;
      btn.disabled = false; btn.textContent = 'Guardar en Google Sheets';
      if (json.status === 'ok') { e.target.reset(); cargarLista(); }
    });
    cargarLista();
  </script>
</body>
</html>
