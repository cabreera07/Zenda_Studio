<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control // zenda studio.</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin-wrap { max-width: 860px; margin: 40px auto; padding: 0 20px; }
    .admin-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:18px; border-bottom:1px solid var(--border); }
    .tabs { display:flex; gap:8px; margin-bottom:24px; }
    .tab-btn { padding:10px 18px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-family:var(--mono); font-size:0.78rem; cursor:pointer; }
    .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px; margin-bottom:24px; }
    .admin-item { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); gap:12px; }
    .admin-item:last-child { border-bottom:none; }
    .tab-pane[hidden] { display:none; }
  </style>
</head>
<body>
  <div class="grid-backdrop"></div>
  <div class="admin-wrap">
    <div class="admin-top">
      <div>
        <a href="index.html" class="brand-logo"><span>zenda studio</span><span class="brand-dot"></span></a>
        <div class="mono-xs" style="color:var(--text-muted); margin-top:4px;">PANEL INTERNO DE CONTROL</div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <button id="theme-toggle" class="icon-btn" type="button"><span id="theme-icon">☀</span></button>
        <a href="index.html" class="btn btn-outline btn-sm">&larr; Volver a la web</a>
      </div>
    </div>

    <div class="panel" style="padding:18px 24px;">
      <div class="form-group" style="margin:0;">
        <label for="global-pin">PIN de Administrador (requerido para guardar cambios)</label>
        <input type="password" id="global-pin" placeholder="Ej. 2026" />
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-catalogo">01 // CATÁLOGO E INVENTARIO</button>
      <button class="tab-btn" data-tab="tab-interfaz">02 // INTERFAZ Y TEXTOS</button>
    </div>

    <!-- PESTAÑA 1: CATÁLOGO -->
    <div id="tab-catalogo" class="tab-pane">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px;">
          <h3>Agregar servicio / paquete</h3>
          <button type="button" id="btn-seed" class="btn btn-outline btn-sm">Cargar 5 ejemplos pro</button>
        </div>
        <form id="admin-form">
          <div class="form-row">
            <div class="form-group"><label>Categoría *</label><input type="text" id="categoria" required placeholder="Sistemas Web, Automatización, Datos" /></div>
            <div class="form-group"><label>Precio (sin símbolo) *</label><input type="text" id="precio" required placeholder="2,400" /></div>
          </div>
          <div class="form-group"><label>Nombre del paquete *</label><input type="text" id="nombre" required placeholder="Ej. Sistema de Cotizaciones + CRM" /></div>
          <div class="form-group"><label>Descripción *</label><input type="text" id="descripcion" required /></div>
          <div class="form-group"><label>Entregables (separados por | )</label><input type="text" id="entregables" placeholder="Panel admin|Conexión Sheets|Soporte 30 días" /></div>
          <div class="form-group"><label>Link de Imagen (Drive), GIF o Video (.mp4)</label><input type="text" id="imagen_drive" placeholder="https://drive.google.com/..." /></div>
          <div class="form-group" style="display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="destacado" style="width:auto;" /><label for="destacado" style="margin:0;">Marcar como recomendado (borde azul)</label>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="btn-save">Guardar en Google Sheets</button>
          <p id="admin-status" class="form-status"></p>
        </form>
      </div>

      <div class="panel">
        <h3 style="margin-bottom:12px;">Servicios activos en tu web</h3>
        <div id="admin-list" class="mono-xs">CARGANDO...</div>
      </div>
    </div>

    <!-- PESTAÑA 2: CONTROL DE INTERFAZ -->
    <div id="tab-interfaz" class="tab-pane" hidden>
      <div class="panel">
        <h3 style="margin-bottom:18px;">Control visual y textos en vivo</h3>
        <form id="config-form">
          <div class="form-group"><label>Título principal (Hero)</label><input type="text" id="cfg-titulo" placeholder="Construimos sistemas que trabajan por tu negocio" /></div>
          <div class="form-group"><label>Subtítulo (Hero)</label><input type="text" id="cfg-subtitulo" placeholder="Desarrollo web, automatización y arquitectura digital..." /></div>
          <div class="form-group"><label>Barra de aviso / promoción superior (dejar vacío para ocultar)</label><input type="text" id="cfg-promo" placeholder="Ej. Agenda abierta para proyectos de diciembre" /></div>
          <div class="form-row">
            <div class="form-group">
              <label>Tema por defecto</label>
              <select id="cfg-tema">
                <option value="dark">Modo Oscuro</option>
                <option value="light">Modo Claro</option>
              </select>
            </div>
            <div class="form-group"><label>Color de acento (HEX)</label><input type="text" id="cfg-color" value="#007bff" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>WhatsApp (con código país)</label><input type="text" id="cfg-wa" placeholder="502XXXXXXXX" /></div>
            <div class="form-group"><label>Correo del estudio</label><input type="email" id="cfg-correo" placeholder="hola@zendastudio.com" /></div>
          </div>
          <div class="form-group">
            <label>Mostrar sección "Cómo trabajamos"</label>
            <select id="cfg-proceso"><option value="SI">Sí, mostrar</option><option value="NO">No, ocultar</option></select>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="btn-cfg">Guardar interfaz en Sheets</button>
          <p id="cfg-status" class="form-status"></p>
        </form>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBQgX8U0CzNe_zH8slUUAgDPMlQG3o0TidWUQ8cX2I88tEGSa6-4zsZet6Y-bqqd12GQ/exec';
    const getPin = () => document.getElementById('global-pin').value.trim();

    // Tema
    const savedTheme = localStorage.getItem('zenda_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('theme-icon').textContent = savedTheme === 'dark' ? '☀' : '☾';
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('zenda_theme', next);
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('theme-icon').textContent = next === 'dark' ? '☀' : '☾';
    });

    // Pestañas
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.hidden = true);
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).hidden = false;
      });
    });

    async function cargarTodo() {
      const list = document.getElementById('admin-list');
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const json = await res.json();
        list.innerHTML = (json.data || []).map(item => `
          <div class="admin-item">
            <div><strong>${item.nombre}</strong> <span class="mono-val text-accent">Q${item.precio}</span><div class="mono-xs" style="color:var(--text-muted)">${item.categoria}</div></div>
            <button class="btn btn-outline btn-sm" onclick="ocultarServicio('${item.id}')">Ocultar</button>
          </div>`).join('') || '<p>No hay servicios activos.</p>';

        if (json.config) {
          const c = json.config;
          if (c.hero_titulo) document.getElementById('cfg-titulo').value = c.hero_titulo;
          if (c.hero_subtitulo) document.getElementById('cfg-subtitulo').value = c.hero_subtitulo;
          if (c.banner_promo) document.getElementById('cfg-promo').value = c.banner_promo;
          if (c.tema_default) document.getElementById('cfg-tema').value = c.tema_default;
          if (c.color_acento) document.getElementById('cfg-color').value = c.color_acento;
          if (c.whatsapp) document.getElementById('cfg-wa').value = c.whatsapp;
          if (c.correo) document.getElementById('cfg-correo').value = c.correo;
          if (c.mostrar_proceso) document.getElementById('cfg-proceso').value = c.mostrar_proceso;
        }
      } catch { list.textContent = 'Error al conectar con Google Sheets.'; }
    }

    window.ocultarServicio = async function(id) {
      const pin = getPin() || prompt('Ingresa tu PIN:');
      if (!pin) return;
      await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'toggle_service', id, pin }) });
      cargarTodo();
    };

    document.getElementById('admin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = getPin(); if (!pin) return alert('Ingresa tu PIN arriba primero.');
      const btn = document.getElementById('btn-save'); const st = document.getElementById('admin-status');
      btn.disabled = true; btn.textContent = 'Guardando...';
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'add_service', pin,
          categoria: document.getElementById('categoria').value.trim(),
          nombre: document.getElementById('nombre').value.trim(),
          precio: document.getElementById('precio').value.trim(),
          descripcion: document.getElementById('descripcion').value.trim(),
          entregables: document.getElementById('entregables').value.trim(),
          imagen_drive: document.getElementById('imagen_drive').value.trim(),
          destacado: document.getElementById('destacado').checked
        })
      });
      const json = await res.json();
      st.textContent = json.status === 'ok' ? 'Guardado en Google Sheets.' : 'Error: ' + json.message;
      btn.disabled = false; btn.textContent = 'Guardar en Google Sheets';
      if (json.status === 'ok') { e.target.reset(); cargarTodo(); }
    });

    document.getElementById('btn-seed').addEventListener('click', async () => {
      const pin = getPin(); if (!pin) return alert('Ingresa tu PIN arriba primero.');
      if (!confirm('¿Agregar 5 paquetes de ejemplo de servicios de sistemas a tu Google Sheet?')) return;
      const btn = document.getElementById('btn-seed');
      btn.disabled = true; btn.textContent = 'Cargando...';
      const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'seed_5_examples', pin }) });
      const json = await res.json();
      alert(json.status === 'ok' ? '¡5 servicios agregados!' : 'Error: ' + json.message);
      btn.disabled = false; btn.textContent = 'Cargar 5 ejemplos pro';
      cargarTodo();
    });

    document.getElementById('config-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = getPin(); if (!pin) return alert('Ingresa tu PIN arriba primero.');
      const btn = document.getElementById('btn-cfg'); const st = document.getElementById('cfg-status');
      btn.disabled = true; btn.textContent = 'Guardando...';
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'save_config', pin,
          config: {
            hero_titulo: document.getElementById('cfg-titulo').value.trim(),
            hero_subtitulo: document.getElementById('cfg-subtitulo').value.trim(),
            banner_promo: document.getElementById('cfg-promo').value.trim(),
            tema_default: document.getElementById('cfg-tema').value,
            color_acento: document.getElementById('cfg-color').value.trim(),
            whatsapp: document.getElementById('cfg-wa').value.trim(),
            correo: document.getElementById('cfg-correo').value.trim(),
            mostrar_proceso: document.getElementById('cfg-proceso').value
          }
        })
      });
      const json = await res.json();
      st.textContent = json.status === 'ok' ? 'Interfaz actualizada en vivo.' : 'Error: ' + json.message;
      btn.disabled = false; btn.textContent = 'Guardar interfaz en Sheets';
    });

    cargarTodo();
  </script>
</body>
</html>
